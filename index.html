<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top:1rem;
  }

  h1 {
    margin-bottom: 0.5rem;
  }

  p {
    margin-bottom: 1.5rem;
  }

  #omikuji-text {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  #omikuji-img {
    width: 200px;
    height: auto;
  }
</style>
</head>

<body>

<h1>おみくじ</h1>
<p>
画像をタップすることで<br>
本日の運勢を占えます
</p>

<div id="omikuji-text">---</div>
<img id="omikuji-img" src="" alt="おみくじ">

<script>
const items = [
  { text: "大吉", img: "documents/images/daikichi.png" },
  { text: "中吉", img: "documents/images/chukichi.png" },
  { text: "小吉", img: "documents/images/syoukichi.png" },
  { text: "末吉", img: "documents/images/suekichi.png" },
  { text: "凶",   img: "documents/images/kyou.png" }
];

const textEl = document.getElementById("omikuji-text");
const imgEl  = document.getElementById("omikuji-img");

let timer = null;
let isRunning = false;

// ランダム表示開始
function startRoulette() {
  isRunning = true;

  timer = setInterval(() => {
    // 回転中は完全ランダムでOK
    const textItem = items[Math.floor(Math.random() * items.length)];
    const imgItem  = items[Math.floor(Math.random() * items.length)];

    textEl.textContent = textItem.text;
    imgEl.src = imgItem.img;
  }, 100);
}

// 停止（結果を揃える）
function stopRoulette() {
  clearInterval(timer);
  isRunning = false;

  // 停止時に1回だけ同じ結果を選ぶ
  const result = items[Math.floor(Math.random() * items.length)];
  textEl.textContent = result.text;
  imgEl.src = result.img;
}

// クリック / タップ制御
function handleTap(e) {
  e.preventDefault();
  isRunning ? stopRoulette() : startRoulette();
}

document.addEventListener("click", handleTap);
document.addEventListener("touchstart", handleTap, { passive: false });

// ページ読み込み時に自動スタート
startRoulette();
</script>

</body>
</html>
