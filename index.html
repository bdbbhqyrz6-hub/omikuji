<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ</title>

<style>
  body {
    margin: 0;
    padding: 1.5rem 1rem;
    box-sizing: border-box;
    text-align: center;
    font-family: sans-serif;
  }

  h1 {
    margin-bottom: 0.5rem;
  }

  p {
    margin-bottom: 1.5rem;
  }

  #omikuji-text {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  #omikuji-img {
    max-width: 100%;
    height: auto;
    touch-action: manipulation; /* スマホ最適化 */
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>おみくじ</h1>
<p>
画像をタップすると<br>
本日の運勢が決まります
</p>

<div id="omikuji-text">---</div>
<img id="omikuji-img" src="" alt="おみくじ">

<script>
const items = [
  { text: "大吉", img: "documents/images/daikichi.png" },
  { text: "中吉", img: "documents/images/chukichi.png" },
  { text: "小吉", img: "documents/images/syoukichi.png" },
  { text: "末吉", img: "documents/images/suekichi.png" },
  { text: "凶",   img: "documents/images/kyou.png" }
];

let timer = null;
let running = false;

const textEl = document.getElementById("omikuji-text");
const imgEl  = document.getElementById("omikuji-img");

function start() {
  running = true;
  timer = setInterval(() => {
    const a = items[Math.floor(Math.random() * items.length)];
    const b = items[Math.floor(Math.random() * items.length)];
    textEl.textContent = a.text;
    imgEl.src = b.img;
  }, 100);
}

function stop() {
  clearInterval(timer);
  running = false;
  const r = items[Math.floor(Math.random() * items.length)];
  textEl.textContent = r.text;
  imgEl.src = r.img;
}

function tap(e) {
  e.preventDefault();
  running ? stop() : start();
}

// 👇 画像だけにイベントを設定
imgEl.addEventListener("click", tap);
imgEl.addEventListener("touchstart", tap, { passive:false });
</script>

</body>
</html>
